services:
  - type: web
    name: youtube-video-api
    runtime: docker
    dockerfilePath: be/Dockerfile
    dockerContext: be
    dockerCommand: bash -lc "bundle exec rails db:migrate && bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DATABASE_POOL
        value: "15"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-video-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: youtube-video-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://youtube-video-frontend.onrender.com
      - key: ACTION_CABLE_URL
        value: wss://youtube-video-api.onrender.com/cable

  - type: worker
    name: youtube-video-worker
    runtime: docker
    dockerfilePath: be/Dockerfile
    dockerContext: be
    dockerCommand: bundle exec sidekiq -q default -c 3
    autoDeployTrigger: checksPass
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: youtube-video-api
          envVarKey: SECRET_KEY_BASE
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-video-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: youtube-video-redis
          property: connectionString

  - type: web
    name: youtube-video-frontend
    runtime: static
    rootDir: fe
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://youtube-video-api.onrender.com
      - key: VITE_CABLE_URL
        value: wss://youtube-video-api.onrender.com/cable

  - type: keyvalue
    name: youtube-video-redis
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: youtube-video-db
    databaseName: youtube_app_production
    user: youtube_app