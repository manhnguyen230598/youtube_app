services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  backend:
    build: ./be
    restart: unless-stopped
    command: bash -lc "bundle exec rails db:migrate && bundle exec puma -C config/puma.rb"
    env_file:
      - .env.production
    depends_on:
      - db
      - redis

  worker:
    build: ./be
    restart: unless-stopped
    command: bundle exec sidekiq -q default -c 1
    env_file:
      - .env.production
    depends_on:
      - db
      - redis

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./fe/build:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
