services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./be
    # db:prepare sẽ tự tạo db và migrate nếu chưa có
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails s -b 0.0.0.0"
    volumes:
      - ./be:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      RAILS_MAX_THREADS: 10	

  frontend:
    build: ./fe
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./fe:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    stdin_open: true
    tty: true
  worker:
    build: ./be
    command: bash -c "bundle exec rails db:prepare && bundle exec rails solid_queue:start"
    volumes:
      - ./be:/app
      - bundle_data:/usr/local/bundle
    depends_on:
      - db
      - redis
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      RAILS_MAX_THREADS: 5
      JOB_CONCURRENCY: 1

volumes:
  postgres_data:
  bundle_data: